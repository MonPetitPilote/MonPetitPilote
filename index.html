    <style>
        /* Styles des fenêtres modales (Règlement et Historique) */
        .modal-back {
            position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;

        .modal-content-inner {
            background-color: #222c43; color: white; padding: 25px; border-radius: 8px;

        }
        .close-modal {
            position: absolute; right: 15px; top: 10px; color: #aaa; font-size: 28px;
            font-weight: bold; cursor: pointer;
        }
        .close-modal:hover { color: #fff; }
        .ligne-joueur:hover { background-color: #2c3a54; transition: 0.2s; }
