<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sortie de Piste | Mon Petit Pilote</title>
    <link rel="icon" href="/images/favicon.png">
    <meta name="theme-color" content="#e10600">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e2538 0%, #0a0d14 100%);
            color: #f1f2f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container-404 {
            max-width: 540px;
            background: rgba(18, 24, 38, 0.95);
            border: 1px solid rgba(225, 6, 0, 0.4);
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        .kerb-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                #e10600,
                #e10600 20px,
                #ffffff 20px,
                #ffffff 40px
            );
        }
        .flag-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(225, 6, 0, 0.15);
            border: 1px solid #e10600;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 900;
            color: #ff4d4d;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 900;
            color: #e10600;
            line-height: 1;
            margin: 0 0 10px 0;
            letter-spacing: -2px;
            text-shadow: 0 0 30px rgba(225, 6, 0, 0.4);
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 14px 0;
            text-transform: uppercase;
        }
        .error-desc {
            font-size: 0.92rem;
            color: #94a3b8;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #e10600 0%, #b30500 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 13px 26px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.92rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(225, 6, 0, 0.35);
            transition: all 0.2s ease;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(225, 6, 0, 0.5);
        }
        .telemetry-foot {
            margin-top: 25px;
            font-size: 0.72rem;
            color: #64748b;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container-404">
        <div class="kerb-top"></div>
        <div class="flag-badge">
            <span>🚩</span> DRAPEAU ROUGE // SESSION INTERROMPUE
        </div>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Sortie de piste !</h2>
        <p class="error-desc">
            La monoplace a manqué la trajectoire ou cette section du circuit a été retirée du calendrier officiel. Regagne les stands avant le redémarrage.
        </p>
        <a href="/" class="btn-home">
            <span>🏎️</span> Regagner la grille de départ
        </a>
        <div class="telemetry-foot">
            STATUS: SECTOR_NOT_FOUND // MON_PETIT_PILOTE_2026
        </div>
    </div>
</body>
</html>
